<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>फॉर्म ऑटो-फिलर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f4ee;
    --ink:#1c1c1a;
    --line:#c9c2ae;
    --accent:#8a3b2b;
    --accent-soft:#f0e2da;
    --field-blue:#1e2a78;
    --panel:#ffffff;
    --danger:#a8402f;
    --muted:#78715f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Devanagari','Segoe UI',sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    padding:26px 22px;
    border-bottom:2px solid var(--line);
    background:linear-gradient(180deg,#fbfaf6,var(--paper));
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:12px;
  }
  header h1{
    margin:0;
    font-size:2rem;
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(90deg, var(--accent), #c1583f 60%, var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  header .sub{
    font-size:1.05rem;
    font-weight:700;
    color:#4a4638;
    margin-top:6px;
    letter-spacing:.15px;
  }
  nav.crumbs{
    font-size:.85rem;
    color:var(--muted);
  }
  nav.crumbs button{
    background:none;
    border:none;
    color:var(--accent);
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-size:.85rem;
    font-family:inherit;
  }
  main{
    max-width:1300px;
    margin:0 auto;
    padding:20px;
  }
  .btn{
    font-family:inherit;
    font-size:.88rem;
    font-weight:600;
    padding:10px 16px;
    border-radius:7px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn.secondary{ background:#fff; color:var(--accent); }
  .btn.danger{ background:#fff; color:var(--danger); border-color:var(--danger); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.small{ padding:6px 10px; font-size:.78rem; }

  /* ---------- LIBRARY ---------- */
  #screen-library .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
    margin-top:18px;
  }
  .upload-card{
    border:2px dashed var(--line);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:30px 14px;
    cursor:pointer;
    color:var(--accent);
    font-weight:600;
    background:#fffef9;
    min-height:220px;
    text-align:center;
  }
  .upload-card:hover{ background:var(--accent-soft); }
  .form-card{
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    background:var(--panel);
    display:flex;
    flex-direction:column;
  }
  .form-card.preset-card{
    border:2px solid #1a6a3a;
    box-shadow:0 1px 4px rgba(26,106,58,.15);
  }
  .form-card .thumb{
    height:150px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .form-card .thumb img{ width:100%; height:100%; object-fit:cover; object-position:top; }
  .form-card .body{ padding:10px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .form-card .name{ font-weight:600; font-size:.92rem; }
  .form-card .meta{ font-size:.72rem; color:var(--muted); }
  .form-card .actions{ display:flex; gap:6px; margin-top:auto; }
  .empty-note{
    color:var(--muted);
    font-size:.9rem;
    margin-top:16px;
  }

  /* ---------- EDITOR / FILL shared layout ---------- */
  .work-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .stage-panel{ flex:2 1 460px; min-width:300px; }
  .side-panel{ flex:1 1 300px; min-width:280px; max-height:80vh; overflow-y:auto; }
  .stage-wrap{
    position:relative;
    display:inline-block;
    max-width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    background:#fff;
    cursor:crosshair;
  }
  .stage-wrap img{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .marker{
    position:absolute;
    transform:translate(0,-100%);
    display:flex;
    align-items:center;
    gap:4px;
    pointer-events:none;
  }
  .marker .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--danger);
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--danger);
    flex-shrink:0;
  }
  .marker .tag{
    background:var(--danger);
    color:#fff;
    font-size:.68rem;
    font-weight:600;
    padding:2px 6px;
    border-radius:4px;
    white-space:nowrap;
  }
  .marker.armed .dot{ background:#1a8a4a; box-shadow:0 0 0 1px #1a8a4a; }
  .marker.armed .tag{ background:#1a8a4a; }

  .overlay-text{
    position:absolute;
    font-family:'Kalam',cursive;
    color:var(--field-blue);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transform:translateY(-100%);
    line-height:1;
    pointer-events:none;
  }

  .field-row{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
    background:#fffef9;
  }
  .field-row .fr-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .field-row .fr-top .num{
    background:var(--accent);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    width:20px;height:20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .field-row input[type=text]{
    flex:1;
    padding:6px 8px;
    border:1px solid #ccc4ac;
    border-radius:5px;
    font-family:inherit;
    font-size:.85rem;
  }
  .field-row .fr-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-bottom:8px;
  }
  .field-row .fr-grid label{
    font-size:.68rem;
    color:var(--muted);
    display:block;
    margin-bottom:2px;
  }
  .field-row .fr-grid input[type=number]{
    width:100%;
    padding:5px 6px;
    border:1px solid #ccc4ac;
    border-radius:5px;
    font-family:inherit;
    font-size:.8rem;
  }
  .field-row .fr-actions{ display:flex; gap:6px; }
  .overlay-img{
    position:absolute;
    transform:translateY(-100%);
    pointer-events:none;
  }
  .overlay-img img{ display:block; width:100%; height:auto; }
  .sig-thumb{
    max-width:180px;
    max-height:70px;
    display:block;
    margin-bottom:6px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px;
    background-color:#fff;
    background-image:
      linear-gradient(45deg, #ddd 25%, transparent 25%),
      linear-gradient(-45deg, #ddd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ddd 75%),
      linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size:16px 16px;
    background-position:0 0, 0 8px, 8px -8px, -8px 0px;
  }
  .sig-bg-controls{
    font-size:.78rem;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:10px;
    background:#fbfaf6;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 10px;
  }
  .sig-bg-controls .toggle-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
    color:var(--ink);
  }
  .sig-bg-controls .slider-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sig-bg-controls input[type=range]{ flex:1; }

  /* ---------- LOGIN / VAULT ---------- */
  .login-wrap{
    display:flex;
    justify-content:center;
    padding:30px 10px;
  }
  .login-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px 22px;
    max-width:420px;
    width:100%;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .login-card h2{
    margin:0 0 6px;
    font-size:1.1rem;
    color:var(--accent);
  }
  .login-card .note{ margin-top:0; margin-bottom:16px; }
  .login-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .login-tabs button{
    flex:1;
    font-family:inherit;
    font-size:.85rem;
    font-weight:600;
    padding:9px 6px;
    border:none;
    background:none;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .login-tabs button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .login-pane label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    margin:10px 0 4px;
  }
  .login-pane input{
    width:100%;
    padding:9px 10px;
    border:1px solid #ccc4ac;
    border-radius:6px;
    font-family:inherit;
    font-size:.9rem;
  }
  .login-pane .btn{ width:100%; margin-top:16px; }
  .header-actions{ display:flex; }
  .sig-upload-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .sig-upload-row input[type=file]{ font-size:.78rem; max-width:170px; }
  .type-toggle{
    display:flex;
    gap:4px;
    margin-bottom:8px;
  }
  .type-toggle button{
    flex:1;
    font-family:inherit;
    font-size:.72rem;
    font-weight:600;
    padding:5px 6px;
    border-radius:5px;
    border:1px solid #ccc4ac;
    background:#fff;
    color:var(--muted);
    cursor:pointer;
  }
  .type-toggle button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .fill-field label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    margin-bottom:4px;
  }
  .fill-field input{
    width:100%;
    padding:8px 10px;
    border:1px solid #ccc4ac;
    border-radius:6px;
    font-size:.92rem;
    font-family:inherit;
    background:#fffef9;
    margin-bottom:12px;
  }
  .hint-banner{
    background:var(--accent-soft);
    border:1px solid var(--accent);
    color:#5c2415;
    font-size:.82rem;
    padding:9px 12px;
    border-radius:7px;
    margin-bottom:14px;
  }
  .name-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .name-row input{
    flex:1;
    min-width:180px;
    padding:8px 10px;
    border:1px solid #ccc4ac;
    border-radius:6px;
    font-family:inherit;
    font-size:.9rem;
  }
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .note{ font-size:.78rem; color:var(--muted); margin-top:10px; }
  h2.panel-title{
    font-size:1rem;
    margin:0 0 12px;
    color:var(--accent);
    border-bottom:1px solid var(--accent-soft);
    padding-bottom:8px;
  }
  #fileInput, #fileInputLib, #templateFileInput{ display:none; }
  .loading{ padding:40px; text-align:center; color:var(--muted); }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,16px);
    background:#1c1c1a; color:#fff; padding:11px 20px; border-radius:9px;
    font-size:.85rem; font-weight:600; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:9999; max-width:88%; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast.error{ background:var(--danger); }
  .toast.ok{ background:#1a6a3a; }
  .compress-box{
    margin-top:20px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fbfaf6;
  }
  .compress-box h3{
    margin:0 0 6px;
    font-size:.92rem;
    color:var(--accent);
  }
  .compress-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .compress-row label{
    font-size:.8rem;
    font-weight:600;
    white-space:nowrap;
  }
  .compress-row input[type=number]{
    width:90px;
    padding:8px 10px;
    border:1px solid #ccc4ac;
    border-radius:6px;
    font-family:inherit;
    font-size:.9rem;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>फॉर्म ऑटो-फिलर</h1>
    <div class="sub" id="headerSub">कोई भी फॉर्म अपलोड करें, फ़ील्ड सेट करें, और अपने आप भरवाएं</div>
  </div>
  <div style="display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;">
    <div class="header-actions" id="headerActions" style="display:none; gap:8px; align-items:center;">
      <span class="note" id="userEmailLabel" style="margin:0;"></span>
      <button class="btn small danger" id="logoutBtn">लॉगआउट</button>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
  </div>
</header>

<main>
  <div id="screen-login"></div>
  <div id="screen-library" style="display:none"></div>
  <div id="screen-editor" style="display:none"></div>
  <div id="screen-fill" style="display:none"></div>
</main>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="templateFileInput" accept="application/json,.json">

// Some restricted/embedded browser contexts (e.g. a downloaded file opened via

// Try normal persistence first; silently fall back to in-memory if it fails.
setPersistence(auth, browserLocalPersistence).catch(()=>{
  return setPersistence(auth, inMemoryPersistence).catch(()=>{});
});

// Wraps a promise so it always settles within `ms`, instead of hanging forever
// when a network/storage call in a restricted browser context never resolves.
function withTimeout(promise, ms, timeoutMessage){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=> reject(new Error(timeoutMessage)), ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timer));
}

/* ---------------- UTIL ---------------- */
function uid(){ return 'fld_' + (fieldSeq++) + '_' + Math.random().toString(36).slice(2,7); }

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function loadImage(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function compressForStorage(dataUrl, maxDim, quality){
  const img = await loadImage(dataUrl);
  let {width,height} = img;
  if(width > maxDim || height > maxDim){
    const scale = maxDim / Math.max(width,height);
    width = Math.round(width*scale);
    height = Math.round(height*scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,width,height);
  ctx.drawImage(img,0,0,width,height);
  return canvas.toDataURL('image/jpeg', quality);
}

// Turns light/white paper background transparent, keeping only dark ink strokes.
// threshold: brightness (0-255) above which a pixel is treated as pure background.
// softness: size of the fade band below threshold, for smooth (non-jagged) edges.
async function removeWhiteBackground(dataUrl, threshold, softness){
  const img = await loadImage(dataUrl);
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  const hi = threshold;
  const lo = Math.max(0, threshold - softness);
  for(let i=0; i<d.length; i+=4){
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    let alpha;
    if(lum <= lo) alpha = 255;
    else if(lum >= hi) alpha = 0;
    else alpha = Math.round(255 * (hi - lum) / (hi - lo));
    d[i+3] = Math.min(d[i+3], alpha);
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas.toDataURL('image/png');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function fetchAsDataURL(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('इमेज डाउनलोड नहीं हो पाई');
  const blob = await res.blob();
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

let sigDebounce = {};
function scheduleSignatureReprocess(id){
  clearTimeout(sigDebounce[id]);
  sigDebounce[id] = setTimeout(()=>{ reprocessSignatureField(id); }, 150);
}

async function reprocessSignatureField(id){
  if(!state.current) return;
  const f = state.current.fields.find(x=>x.id===id);
  if(!f || !f.sigRaw) return;
  try{
    f.value = f.bgRemove===false ? f.sigRaw : await removeWhiteBackground(f.sigRaw, f.bgThreshold||200, 40);
  }catch(e){
    console.error('signature reprocess failed', e);
    return;
  }
  const thumb = document.querySelector(`.sig-thumb[data-id="${id}"]`);
  if(thumb) thumb.src = f.value;
  const overlayImg = document.querySelector(`.overlay-img[data-id="${id}"] img`);
  if(overlayImg) overlayImg.src = f.value;
}

let toastTimer = null;
function showToast(msg, kind){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show' + (kind ? (' '+kind) : '');
  clearTimeout(toastTimer);
  const duration = kind === 'error' ? 9000 : 3000;
  toastTimer = setTimeout(()=>{ t.className = 'toast'; }, duration);
}

/* ---------------- SIZE-TARGETED COMPRESSION ---------------- */
function canvasToBlobP(canvas, quality){
  return new Promise(resolve=>{
    canvas.toBlob(b=>resolve(b), 'image/jpeg', quality);
  });
}

// Finds the highest JPEG quality (and, if needed, a smaller resolution)
// that keeps the file at or under maxBytes. Always tries full resolution
// first so quality is only sacrificed after size, not before.
async function compressCanvasToTarget(sourceCanvas, maxBytes, minDim){
  const baseW = sourceCanvas.width, baseH = sourceCanvas.height;
  let scale = 1;
  while(true){
    const w = Math.max(minDim, Math.round(baseW*scale));
    const h = Math.round(baseH * (w/baseW));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceCanvas, 0, 0, w, h);

    let lo = 0.05, hi = 0.95, bestBlob = null, bestQ = null;
    for(let i=0;i<8;i++){
      const mid = (lo+hi)/2;
      const blob = await canvasToBlobP(c, mid);
      if(blob.size <= maxBytes){
        bestBlob = blob; bestQ = mid;
        lo = mid;
      } else {
        hi = mid;
      }
    }
    if(bestBlob){
      return { blob: bestBlob, quality: bestQ, scale, width:w, height:h };
    }
    if(w <= minDim){
      const blob = await canvasToBlobP(c, 0.05);
      return { blob, quality: 0.05, scale, width:w, height:h };
    }
    scale *= 0.85;
  }
}

async function renderFilledCanvas(){
  const cur = state.current;
  const img = await loadImage(cur.imageDataUrl);
  const W = img.naturalWidth, H = img.naturalHeight;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img,0,0,W,H);

  if(document.fonts && document.fonts.ready){
    await document.fonts.load('40px Kalam');
    await document.fonts.ready;
  }

  ctx.fillStyle = '#1e2a78';
  ctx.textBaseline = 'alphabetic';
  for(const f of cur.fields){
    const value = f.value;
    if(!value) continue;
    const xPx = f.xPct/100 * W;
    const yPx = f.yPct/100 * H;
    const maxWidthPx = f.widthPct/100 * W;

    if(f.type === 'signature'){
      try{
        const sigImg = await loadImage(value);
        const scale = maxWidthPx / sigImg.naturalWidth;
        const boxH = sigImg.naturalHeight * scale;
        ctx.drawImage(sigImg, xPx, yPx - boxH, maxWidthPx, boxH);
      }catch(e){ console.error('signature draw failed', e); }
      continue;
    }

    let size = f.fontPct/100 * H;
    ctx.font = `${size}px Kalam, cursive`;
    let w = ctx.measureText(value).width;
    while(w > maxWidthPx && size > 10){
      size -= 2;
      ctx.font = `${size}px Kalam, cursive`;
      w = ctx.measureText(value).width;
    }
    ctx.fillText(value, xPx, yPx);
  }
  return canvas;
}

async function downloadCompressed(){
  const cur = state.current;
  const btn = document.getElementById('compressBtn');
  const sizeLabel = document.getElementById('compressSizeLabel');
  const targetInput = document.getElementById('targetSizeInput');
  const targetKB = Math.max(10, Math.min(800, parseInt(targetInput.value,10) || 90));
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'कंप्रेस हो रहा है...'; }
  if(sizeLabel) sizeLabel.textContent = '';
  try{
    const filledCanvas = await renderFilledCanvas();
    const result = await compressCanvasToTarget(filledCanvas, targetKB*1024, 500);
    const finalKB = (result.blob.size/1024).toFixed(1);
    if(sizeLabel) sizeLabel.textContent = `फ़ाइनल साइज़: ${finalKB} KB (${result.width}×${result.height}px)`;

    const url = URL.createObjectURL(result.blob);
    const link = document.createElement('a');
    link.download = (cur.name || 'form') + '-compressed.jpg';
    link.href = url;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast(`डाउनलोड हो गया — ${finalKB} KB`, 'ok');
  }catch(e){
    console.error('compress failed:', e);
    showToast('कंप्रेस करने में समस्या आई।', 'error');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

  el.innerHTML = `
    <div class="hint-banner">
      यहाँ बनाए फॉर्म अपने आप आपके अकाउंट में सुरक्षित रहते हैं — किसी भी डिवाइस से लॉगिन करके वापस मिल जाएंगे।
    </div>

    <h2 class="panel-title" style="margin-top:4px;">✅ प्रीसेट फॉर्म (बिना क्लिक — सीधे भरें)</h2>
    <div class="grid">
      ${presetCards || '<div class="empty-note">अभी कोई प्रीसेट फॉर्म उपलब्ध नहीं है।</div>'}
    </div>

    <h2 class="panel-title" style="margin-top:26px;">कस्टम फॉर्म (अपने खुद के फॉर्म)</h2>
    <div class="grid">
      <div class="upload-card" id="uploadCard">
        <div style="font-size:2rem">＋</div>
        <div>नया फॉर्म अपलोड करें</div>
      </div>
      <div class="upload-card" id="uploadTemplateCard">
        <div style="font-size:2rem">📄</div>
        <div>सिंगल टेम्पलेट फ़ाइल से खोलें (.json)</div>
      </div>
      ${cards}
    </div>
    ${state.library.length===0 ? `<div class="empty-note">इस अकाउंट में अभी कोई कस्टम फॉर्म नहीं है।</div>` : ''}
  `;

  el.querySelectorAll('[data-preset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const preset = PRESET_FORMS.find(p=>p.id===btn.dataset.preset);
      if(!preset) return;
      loadImage(preset.imageDataUrl).then(img=>{
        state.current = {
          id: null,
          name: preset.name,
          imageDataUrl: preset.imageDataUrl,
          naturalWidth: img.naturalWidth,
          naturalHeight: img.naturalHeight,
          fields: preset.fields.map(f=>({...f, value:'', sigRaw:''}))
        };
        goScreen('fill');
      });
    });
  });

  document.getElementById('uploadCard').addEventListener('click', ()=>{
    document.getElementById('fileInput').click();
  });
  document.getElementById('uploadTemplateCard').addEventListener('click', ()=>{
    document.getElementById('templateFileInput').click();
  });

  el.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      const action = btn.dataset.action;
      if(action==='fill') loadFormByKey(key);
      else if(action==='edit') editFormByKey(key);
      else if(action==='delete'){
        if(btn.dataset.confirming==='1'){
          deleteForm(key);
        } else {
          btn.dataset.confirming = '1';
          const original = btn.textContent;
          btn.textContent = 'पक्का हटाएं?';
          setTimeout(()=>{
            if(btn.dataset.confirming==='1'){
              btn.dataset.confirming='';
              btn.textContent = original;
            }
          }, 3000);
        }
      }
    });
  });
}

/* ---------------- RENDER: EDITOR ---------------- */
function renderEditor(){
  const el = document.getElementById('screen-editor');
  const cur = state.current;
  if(!cur){ el.innerHTML=''; return; }

  const markers = cur.fields.map((f,i)=>`
    <div class="marker ${state.repositioning===f.id ? 'armed':''}" style="left:${f.xPct}%; top:${f.yPct}%;">
      <div class="dot"></div>
      <div class="tag">${f.type==='signature' ? '✍️ ' : ''}${i+1}. ${escapeHtml(f.label)}</div>
    </div>
  `).join('');

  const rows = cur.fields.map((f,i)=>`
    <div class="field-row" data-id="${f.id}">
      <div class="fr-top">
        <div class="num">${i+1}</div>
        <input type="text" data-field="label" value="${escapeHtml(f.label)}" placeholder="फ़ील्ड का नाम">
      </div>
      <div class="type-toggle">
        <button type="button" data-type-btn="text" class="${f.type!=='signature' ? 'active':''}" data-id="${f.id}">टेक्स्ट</button>
        <button type="button" data-type-btn="signature" class="${f.type==='signature' ? 'active':''}" data-id="${f.id}">✍️ हस्ताक्षर (इमेज)</button>
      </div>
      <div class="fr-grid">
        <div>
          <label>चौड़ाई %</label>
          <input type="number" data-field="widthPct" value="${f.widthPct}" min="3" max="90" step="1">
        </div>
        ${f.type==='signature' ? `
        <div>
          <label>&nbsp;</label>
          <div class="note" style="margin-top:6px;">ऊँचाई अपने आप सेट होगी</div>
        </div>` : `
        <div>
          <label>फ़ॉन्ट %</label>
          <input type="number" data-field="fontPct" value="${f.fontPct}" min="0.5" max="6" step="0.1">
        </div>`}
        <div>
          <label>&nbsp;</label>
          <button class="btn small secondary" data-reposition="${f.id}" style="width:100%">स्थान बदलें</button>
        </div>
      </div>
      <div class="fr-actions">
        <button class="btn small danger" data-delete="${f.id}">हटाएं</button>
      </div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="hint-banner">
      ${state.repositioning
        ? 'नई जगह चुनने के लिए नीचे फॉर्म पर क्लिक करें।'
        : 'जहाँ जानकारी भरनी है, वहाँ फॉर्म की उस खाली लाइन पर क्लिक करें — एक नई फ़ील्ड बन जाएगी। नीचे लिस्ट में उसका नाम बदल सकते हैं।'}
    </div>
    <div class="name-row">
      <input type="text" id="formNameInput" value="${escapeHtml(cur.name)}" placeholder="फॉर्म का नाम">
      <button class="btn secondary" id="saveFormBtn">मेरे अकाउंट में सेव करें</button>
      <button class="btn" id="exportBtn">सिंगल टेम्पलेट डाउनलोड करें</button>
    </div>
    <div class="note" style="margin-top:-8px; margin-bottom:14px;">"मेरे अकाउंट में सेव करें" दबाते ही फॉर्म अपने आप आपके अकाउंट में सुरक्षित हो जाता है — किसी भी डिवाइस से लॉगिन करके मिल जाएगा। "सिंगल टेम्पलेट डाउनलोड करें" सिर्फ़ इसी एक फॉर्म की एक अलग फ़ाइल देता है, जिसे बिना लॉगिन के भी उपयोग किया जा सकता है।</div>
    <div class="work-wrap">
      <div class="panel stage-panel">
        <h2 class="panel-title">फॉर्म पर फ़ील्ड लगाएं</h2>
        <div class="stage-wrap" id="stageWrap">
          <img src="${cur.imageDataUrl}" id="editorImg" alt="form">
          ${markers}
        </div>
      </div>
      <div class="panel side-panel">
        <h2 class="panel-title">फ़ील्ड लिस्ट (${cur.fields.length})</h2>
        ${rows || '<div class="note">अभी कोई फ़ील्ड नहीं जोड़ी गई।</div>'}
        <button class="btn" id="proceedFillBtn" style="width:100%; margin-top:8px;" ${cur.fields.length===0?'disabled':''}>भरने के लिए आगे बढ़ें →</button>
      </div>
    </div>
  `;

  document.getElementById('stageWrap').addEventListener('click', (e)=>{
    if(e.target.closest('.marker')) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;
    addFieldAt(Math.max(0,Math.min(100,xPct)), Math.max(0,Math.min(100,yPct)));
  });

  document.getElementById('formNameInput').addEventListener('input', (e)=>{
    cur.name = e.target.value;
  });
  document.getElementById('saveFormBtn').addEventListener('click', saveCurrentForm);
  document.getElementById('exportBtn').addEventListener('click', exportTemplate);
  document.getElementById('proceedFillBtn').addEventListener('click', ()=>{
    cur.fields.forEach(f=>f.value='');
    goScreen('fill');
  });

  el.querySelectorAll('[data-reposition]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.repositioning = btn.dataset.reposition;
      render();
    });
  });
  el.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      deleteField(btn.dataset.delete);
    });
  });
  el.querySelectorAll('[data-type-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const type = btn.dataset.typeBtn;
      const patch = {type};
      if(type==='signature'){ patch.value = ''; } // signature values are images, clear stray text
      updateField(id, patch);
      render();
    });
  });
  el.querySelectorAll('.field-row').forEach(row=>{
    const id = row.dataset.id;
    row.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const field = inp.dataset.field;
        let val = inp.value;
        if(field==='widthPct' || field==='fontPct') val = parseFloat(val)||0;
        updateField(id, {[field]: val});
        // reflect label change on marker without full rerender jank
        const markerTag = document.querySelectorAll('.marker .tag')[[...cur.fields].findIndex(f=>f.id===id)];
        if(field==='label' && markerTag){
          const i = cur.fields.findIndex(f=>f.id===id);
          markerTag.textContent = (i+1) + '. ' + val;
        }
      });
    });
  });
}

/* ---------------- RENDER: FILL ---------------- */
function renderFill(){
  const el = document.getElementById('screen-fill');
  const cur = state.current;
  if(!cur){ el.innerHTML=''; return; }

  const inputs = cur.fields.map(f=>{
    if(f.type === 'signature'){
      const bgOn = f.bgRemove !== false;
      return `
        <div class="fill-field">
          <label>✍️ ${escapeHtml(f.label)}</label>
          ${f.value ? `<img class="sig-thumb" data-id="${f.id}" src="${f.value}" alt="signature">` : ''}
          <div class="sig-upload-row">
            <input type="file" accept="image/*" data-sig-upload="${f.id}">
            ${f.value ? `<button class="btn small secondary" data-sig-clear="${f.id}">हटाएं</button>` : ''}
          </div>
          ${f.sigRaw ? `
          <div class="sig-bg-controls">
            <label class="toggle-row">
              <input type="checkbox" data-sig-bgtoggle="${f.id}" ${bgOn ? 'checked' : ''}>
              बैकग्राउंड हटाएं (सिर्फ स्याही दिखेगी)
            </label>
            ${bgOn ? `
            <div class="slider-row">
              <span>हल्का</span>
              <input type="range" min="120" max="250" step="5" value="${f.bgThreshold||200}" data-sig-threshold="${f.id}">
              <span>गहरा</span>
            </div>
            <div>पेपर सफ़ेद न हो या फोटो में शैडो हो तो स्लाइडर घुमाकर एडजस्ट करें।</div>
            ` : ''}
          </div>` : ''}
        </div>
      `;
    }
    return `
      <div class="fill-field">
        <label for="in_${f.id}">${escapeHtml(f.label)}</label>
        <input type="text" id="in_${f.id}" data-id="${f.id}" value="${escapeHtml(f.value||'')}" autocomplete="off">
      </div>
    `;
  }).join('');

  const overlays = cur.fields.map(f=>{
    if(f.type === 'signature'){
      return f.value
        ? `<div class="overlay-img" data-id="${f.id}" style="left:${f.xPct}%; top:${f.yPct}%; width:${f.widthPct}%;"><img src="${f.value}" alt=""></div>`
        : '';
    }
    return `<div class="overlay-text" data-id="${f.id}"
      style="left:${f.xPct}%; top:${f.yPct}%; width:${f.widthPct}%; font-size:${f.fontPct}vh;">${escapeHtml(f.value||'')}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="toolbar">
      <button class="btn secondary" id="backToEditBtn">← फ़ील्ड बदलें</button>
      <button class="btn secondary" id="backToLibBtn">लाइब्रेरी</button>
    </div>
    <div class="work-wrap">
      <div class="panel side-panel" style="order:1">
        <h2 class="panel-title">जानकारी भरें</h2>
        ${inputs || '<div class="note">इस फॉर्म में कोई फ़ील्ड सेट नहीं है।</div>'}
      </div>
      <div class="panel stage-panel" style="order:2">
        <h2 class="panel-title">लाइव प्रीव्यू</h2>
        <div class="stage-wrap" id="fillStage" style="cursor:default">
          <img src="${cur.imageDataUrl}" id="fillImg" alt="form">
          ${overlays}
        </div>
        <div style="text-align:center; margin-top:14px;">
          <button class="btn secondary" id="downloadBtn">फॉर्म डाउनलोड करें (PNG)</button>
        </div>
        <div class="note" style="text-align:center">हस्ताक्षर के लिए ऊपर "हस्ताक्षर" फ़ील्ड में अपने साइन की फोटो अपलोड करें।</div>

        <div class="compress-box">
          <h3>इमेज कंप्रेस करके डाउनलोड करें</h3>
          <p class="note" style="margin-top:0">चाहे ओरिजिनल फॉर्म कितना भी बड़ा (जैसे 1 MB) क्यों न हो — नीचे टारगेट साइज़ डालें, जितनी अच्छी क्वालिटी में फिट होगा उतनी रखकर उसी साइज़ के आसपास JPG बनेगा।</p>
          <div class="compress-row">
            <label for="targetSizeInput">टारगेट साइज़ (KB)</label>
            <input type="number" id="targetSizeInput" value="90" min="10" max="800" step="5">
            <button class="btn" id="compressBtn">कंप्रेस्ड JPG डाउनलोड करें</button>
          </div>
          <div class="note" id="compressSizeLabel" style="text-align:left; font-weight:600;"></div>
        </div>
      </div>
    </div>
  `;

  function resizeFonts(){
    const stage = document.getElementById('fillStage');
    if(!stage) return;
    const h = stage.clientHeight;
    cur.fields.forEach(f=>{
      if(f.type==='signature') return;
      const node = stage.querySelector(`.overlay-text[data-id="${f.id}"]`);
      if(node) node.style.fontSize = (f.fontPct/100*h) + 'px';
    });
  }
  document.getElementById('fillImg').addEventListener('load', resizeFonts);
  window.addEventListener('resize', resizeFonts);
  resizeFonts();

  el.querySelectorAll('.fill-field input[type=text]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const id = inp.dataset.id;
      const f = cur.fields.find(x=>x.id===id);
      f.value = inp.value;
      const node = document.querySelector(`.overlay-text[data-id="${id}"]`);
      if(node) node.textContent = inp.value;
    });
  });

  el.querySelectorAll('[data-sig-upload]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const id = inp.dataset.sigUpload;
      const file = e.target.files[0];
      e.target.value = '';
      if(!file) return;
      const f = cur.fields.find(x=>x.id===id);
      try{
        const dataUrl = await fileToDataURL(file);
        f.sigRaw = dataUrl;
        if(f.bgRemove === undefined) f.bgRemove = true;
        if(f.bgThreshold === undefined) f.bgThreshold = 200;
        f.value = f.bgRemove ? await removeWhiteBackground(dataUrl, f.bgThreshold, 40) : dataUrl;
        renderFill();
      }catch(err){
        console.error(err);
        showToast('हस्ताक्षर इमेज लोड नहीं हो पाई।', 'error');
      }
    });
  });
  el.querySelectorAll('[data-sig-clear]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.sigClear;
      const f = cur.fields.find(x=>x.id===id);
      f.value = '';
      f.sigRaw = '';
      renderFill();
    });
  });
  el.querySelectorAll('[data-sig-bgtoggle]').forEach(chk=>{
    chk.addEventListener('change', async ()=>{
      const id = chk.dataset.sigBgtoggle;
      const f = cur.fields.find(x=>x.id===id);
      f.bgRemove = chk.checked;
      await reprocessSignatureField(id);
      renderFill();
    });
  });
  el.querySelectorAll('[data-sig-threshold]').forEach(rng=>{
    rng.addEventListener('input', ()=>{
      const id = rng.dataset.sigThreshold;
      const f = cur.fields.find(x=>x.id===id);
      f.bgThreshold = parseInt(rng.value, 10);
      scheduleSignatureReprocess(id);
    });
  });

  document.getElementById('backToEditBtn').addEventListener('click', ()=> goScreen('editor'));
  document.getElementById('backToLibBtn').addEventListener('click', ()=>{ state.current=null; goScreen('library'); refreshLibrary(); });
  document.getElementById('downloadBtn').addEventListener('click', downloadFilled);
  document.getElementById('compressBtn').addEventListener('click', downloadCompressed);
}

/* ---------------- MASTER RENDER ---------------- */
function render(){
  document.getElementById('screen-login').style.display = state.screen==='login' ? '' : 'none';
  document.getElementById('screen-library').style.display = state.screen==='library' ? '' : 'none';
  document.getElementById('screen-editor').style.display = state.screen==='editor' ? '' : 'none';
  document.getElementById('screen-fill').style.display = state.screen==='fill' ? '' : 'none';

  const crumbs = document.getElementById('crumbs');
  const subEl = document.getElementById('headerSub');
  const headerActions = document.getElementById('headerActions');
  headerActions.style.display = state.screen === 'login' ? 'none' : 'flex';

  if(state.screen==='login'){
    crumbs.innerHTML = '';
    subEl.textContent = 'लॉगिन करें या नया अकाउंट बनाएं';
    renderLogin();
  } else if(state.screen==='library'){
    crumbs.innerHTML = '';
    subEl.textContent = 'कोई भी फॉर्म अपलोड करें, फ़ील्ड सेट करें, और अपने आप भरवाएं';
    renderLibrary();
  } else if(state.screen==='editor'){
    crumbs.innerHTML = `<button id="crumbLib">लाइब्रेरी</button> / फ़ील्ड सेट करें`;
    subEl.textContent = state.current ? state.current.name : '';
    renderEditor();
    const c = document.getElementById('crumbLib');
    if(c) c.addEventListener('click', ()=>{ goScreen('library'); refreshLibrary(); });
  } else if(state.screen==='fill'){
    crumbs.innerHTML = `<button id="crumbLib">लाइब्रेरी</button> / फॉर्म भरें`;
    subEl.textContent = state.current ? state.current.name : '';
    renderFill();
    const c = document.getElementById('crumbLib');
    if(c) c.addEventListener('click', ()=>{ state.current=null; goScreen('library'); refreshLibrary(); });
  }

  const emailLabel = document.getElementById('userEmailLabel');
  if(emailLabel) emailLabel.textContent = currentUser ? currentUser.email : '';
}

document.getElementById('logoutBtn').addEventListener('click', logoutUser);

/* ---------------- INIT ---------------- */
render();

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(user){
    goScreen('library');
    refreshLibrary();
  } else {
    state.current = null;
    state.library = [];
    goScreen('login');
  }
});
</script>

</body>
</html>
